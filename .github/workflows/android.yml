name: android

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request: {}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          path: stk-code

      - name: Configure packaging name for git master branch
        run: |
          echo "release_tag=git`date +%Y%m%d`" >> $GITHUB_ENV

      - name: Download assets using SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn co -r 18627 https://svn.code.sf.net/p/supertuxkart/code/stk-assets stk-assets

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get install -y autoconf automake make python3 python3-packaging \
            python3-mako flex bison imagemagick cmake meson vorbis-tools pngquant \
            advancecomp libjpeg-progs optipng ccache unzip

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar NDK e build-tools do Android
        run: |
          sdkmanager --install "ndk;28.1.13356709" "build-tools;35.0.0" "platforms;android-35"

      - name: Download STK Android dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stk-code
          gh release download preview -R supertuxkart/dependencies -p "dependencies-android-src.tar.xz"
          tar -xf dependencies-android-src.tar.xz -C lib

      - name: Build dependencies and APK
        run: |
          cd stk-code/android
          ln -sfn "$ANDROID_HOME" android-sdk
          ln -sfn "$ANDROID_HOME/ndk" android-ndk
          export SDK_PATH="$ANDROID_HOME"
          export NDK_PATH="$ANDROID_HOME/ndk"
          export COMPILE_ARCH=all
          export BUILD_TYPE=debug
          export PROJECT_VERSION=git
          ./generate_assets.sh
          ./make_deps.sh
          ./make.sh

      - name: Get compiled APK
        run: |
          mkdir -p apk-out
          find stk-code/android -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Send APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperTuxKart-dbg-${{ env.release_tag }}-android
          path: apk-out/*.apk
          if-no-files-found: error
